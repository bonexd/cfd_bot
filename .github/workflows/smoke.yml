name: Smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile core modules
        run: python -m py_compile app/main.py app/auto.py app/desk.py app/web_app.py app/risk.py app/instruments.py app/broker/capital.py scripts/sticky_console.py
      - name: Import startup modules
        run: python -c "import app.auto, app.desk, app.web_app"
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run Node regression tests
        run: node --test tests/*.test.mjs
      - name: Verify 21 markets and shared risk
        run: |
          python -c "import yaml, app; from main import enabled_markets; from instruments import MARKETS; cfg=yaml.safe_load(open('config.yaml', encoding='utf-8')); assert cfg['risk']['risk_per_trade_pct']==0.7; assert len(MARKETS)==21; assert len(enabled_markets(cfg,'demo'))==21; assert len(enabled_markets(cfg,'live'))==21; assert all((cfg['markets'][k] or {}).get('live_enabled') is True for k in MARKETS)"
      - name: Verify bonexd updater
        run: python -c "from pathlib import Path; s=Path('UPDATE.bat').read_text(encoding='utf-8'); assert 'https://github.com/bonexd/cfd_bot.git' in s; assert 'bloodvitr/cfd_bot' not in s"
